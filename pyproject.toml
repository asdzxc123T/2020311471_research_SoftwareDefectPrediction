[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdp-defect-prediction"
version = "0.1.0"
description = "Multimodal software defect prediction research pipeline (CPG + text + static metrics)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Research" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0.2",
  "pydantic>=2.7",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "tqdm>=4.66",
  "joblib>=1.4",
  "pyarrow>=16.1",
  "pydriller>=2.6",
  "GitPython>=3.1",
  "shap>=0.46",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

