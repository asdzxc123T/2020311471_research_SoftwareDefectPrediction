project:
  seed: 42

data:
  source: github_labeled
  input_path: data/processed/repos/commons_lang/labeled.parquet
  output_path: data/processed/repos/commons_lang/dataset.parquet
  temporal_split:
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15

pipeline:
  repo_path: data/raw/repos/commons-lang
  repo_name: apache/commons-lang
  repo_url: https://github.com/apache/commons-lang
  max_commits: 1000
  raw_records: data/processed/repos/commons_lang/function_records.parquet
  bfc_records: data/processed/repos/commons_lang/with_bfc.parquet
  labeled_records: data/processed/repos/commons_lang/labeled.parquet
  szz_method: szz_v1

train:
  task: baseline_rf
  features:
    numeric: [loc_added, loc_deleted, churn, cyclomatic_complexity]
    text: diff_text
  label_col: is_bug_inducing
  output_model_path: artifacts/models/github_commons_lang_baseline.joblib

eval:
  model_path: artifacts/models/github_commons_lang_baseline.joblib
  dataset_path: data/processed/repos/commons_lang/dataset.parquet
  label_col: is_bug_inducing
  effort_col: churn
  topk_loc: 0.2
  output_metrics_path: reports/metrics/github_commons_lang_metrics.json
