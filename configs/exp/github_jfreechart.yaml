project:
  seed: 42

data:
  source: github_labeled
  input_path: data/processed/repos/jfreechart/labeled.parquet
  output_path: data/processed/repos/jfreechart/dataset.parquet
  temporal_split:
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15

pipeline:
  repo_path: data/raw/repos/jfreechart
  repo_name: jfree/jfreechart
  repo_url: https://github.com/jfree/jfreechart
  max_commits: 1500
  raw_records: data/processed/repos/jfreechart/function_records.parquet
  bfc_records: data/processed/repos/jfreechart/with_bfc.parquet
  labeled_records: data/processed/repos/jfreechart/labeled.parquet
  szz_method: szz_v1

train:
  task: baseline_rf
  features:
    numeric: [loc_added, loc_deleted, churn, cyclomatic_complexity]
    text: diff_text
  label_col: is_bug_inducing
  output_model_path: artifacts/models/github_jfreechart_baseline.joblib

eval:
  model_path: artifacts/models/github_jfreechart_baseline.joblib
  dataset_path: data/processed/repos/jfreechart/dataset.parquet
  label_col: is_bug_inducing
  effort_col: churn
  topk_loc: 0.2
  output_metrics_path: reports/metrics/github_jfreechart_metrics.json
