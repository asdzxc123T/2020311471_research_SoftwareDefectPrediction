project:
  seed: 42

data:
  source: github_labeled
  input_path: data/processed/github_labeled_merged.parquet
  output_path: data/processed/github_dataset.parquet
  temporal_split:
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15
  train_subset: 800

train:
  task: codebert_only
  epochs: 1
  batch_size: 8
  lr: 0.0001
  features:
    numeric: [loc_added, loc_deleted, churn, cyclomatic_complexity]
    text: diff_text
    code: code_text
  label_col: is_bug_inducing
  output_model_path: artifacts/models/ablation_github_text.pt

eval:
  model_path: artifacts/models/ablation_github_text.pt
  dataset_path: data/processed/github_dataset.parquet
  label_col: is_bug_inducing
  effort_col: churn
  topk_loc: 0.2
  output_metrics_path: reports/metrics/ablation_github_text.json
