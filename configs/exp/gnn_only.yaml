project:
  seed: 42

data:
  source: sample
  sample:
    n_repos: 2
    n_commits_per_repo: 60
  output_path: data/processed/sample_gnn.parquet
  temporal_split:
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15

train:
  task: gnn_only
  epochs: 5
  batch_size: 16
  lr: 0.0001
  features:
    numeric: [loc_added, loc_deleted, churn, cyclomatic_complexity]
    text: diff_text
    code: code_text
  label_col: is_bug_inducing
  output_model_path: artifacts/models/gnn_only.pt

eval:
  model_path: artifacts/models/gnn_only.pt
  dataset_path: data/processed/sample_gnn.parquet
  label_col: is_bug_inducing
  effort_col: churn
  topk_loc: 0.2
  output_metrics_path: reports/metrics/gnn_only_metrics.json
