project:
  seed: 42

data:
  source: github_labeled
  input_path: data/processed/github_labeled.parquet
  output_path: data/processed/github_dataset.parquet
  temporal_split:
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15

pipeline:
  repo_path: data/raw/repos/sample_repo
  repo_name: sample/repo
  repo_url: https://github.com/sample/repo
  max_commits: 500
  raw_records: data/raw/function_records.parquet
  bfc_records: data/processed/github_with_bfc.parquet
  labeled_records: data/processed/github_labeled.parquet
  szz_method: szz_v1  # simple|szz_v1

train:
  task: baseline_rf
  features:
    numeric: [loc_added, loc_deleted, churn, cyclomatic_complexity]
    text: diff_text
  label_col: is_bug_inducing
  output_model_path: artifacts/models/github_baseline.joblib

eval:
  model_path: artifacts/models/github_baseline.joblib
  dataset_path: data/processed/github_dataset.parquet
  label_col: is_bug_inducing
  effort_col: churn
  topk_loc: 0.2
  output_metrics_path: reports/metrics/github_metrics.json
