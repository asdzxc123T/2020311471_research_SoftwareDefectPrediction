services:
  trainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/workspace
    working_dir: /workspace
    command: bash -lc "python scripts/00_env_check.py && sleep infinity"

  # Joern 서비스는 환경 고정/분리를 위한 자리입니다.
  # 실제 이미지/버전 고정은 `docker/README.md`의 가이드에 따라 결정합니다.
  joern:
    image: joernio/joern:latest
    profiles: ["optional"]
    entrypoint: ["bash", "-lc", "joern --version || true; sleep infinity"]

